name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tcw-control-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TCWControl-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TCWControl-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build" --notes "Built from $GITHUB_SHA"
